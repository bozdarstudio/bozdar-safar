name: Rename project zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename zip to project.zip
        run: |
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          ls -l project-pd-v1431.zip
          git mv project-pd-v1431.zip project.zip
          git status --short
          git commit -m "Rename project-pd-v1431.zip to project.zip"
          git push
