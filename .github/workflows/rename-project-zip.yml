name: Rename project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename zip to project.zip
        run: |
          ls -la *.zip
          mv project-pd-v1422.zip project.zip
          ls -la *.zip
      - name: Commit renamed zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename project-pd-v1422.zip to project.zip"
          git push
