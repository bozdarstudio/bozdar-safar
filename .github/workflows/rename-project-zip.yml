name: Rename Project Zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename zip and verify size
        run: |
          ls -l project-pd-v1421.zip
          test "$(stat -c%s project-pd-v1421.zip)" = "20623078"
          mv project-pd-v1421.zip project.zip
          ls -l project.zip
          test "$(stat -c%s project.zip)" = "20623078"
          echo "project.zip size verified: 20623078 bytes"
      - name: Commit renamed file
        run: |
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rename project-pd-v1421.zip to project.zip"
          git push
