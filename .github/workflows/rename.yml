name: rename-zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mv project-pd-v1430.zip project.zip
          git add -A
          git commit -m "rename project zip"
          git push
