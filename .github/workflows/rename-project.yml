name: Rename project zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1418-build2
      - name: Replace project.zip with v1.4.18 zip
        run: |
          set -eux
          test -f project-pd-v1418.zip
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          rm -f project.zip
          git mv project-pd-v1418.zip project.zip
          git rm -q .github/workflows/rename-project.yml
          ls -l project.zip
          stat -c %s project.zip
          git status --short
          git add -A
          git commit -m "Replace project.zip - v1.4.18+41"
          git push origin HEAD:v1418-build2
