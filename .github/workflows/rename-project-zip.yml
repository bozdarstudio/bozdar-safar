name: Rename project zip

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename project-pd-v1420.zip to project.zip
        run: |
          ls -l project-pd-v1420.zip
          mv project-pd-v1420.zip project.zip
          ls -l project.zip
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          git add -A
          git commit -m "Rename project-pd-v1420.zip to project.zip"
          git push
