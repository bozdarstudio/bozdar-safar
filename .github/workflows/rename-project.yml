name: Rename project zip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace project.zip with v1.4.33 zip
        run: |
          set -eux
          test -f project-pd-v1433.zip
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          rm -f project.zip
          git mv project-pd-v1433.zip project.zip
          git rm -q .github/workflows/rename-project.yml
          ls -l project.zip
          stat -c %s project.zip
          git status --short
          git add -A
          git commit -m "Replace project.zip - v1.4.33 [skip ci]"
          git push origin HEAD:main
