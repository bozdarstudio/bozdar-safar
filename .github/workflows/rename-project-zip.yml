name: Rename project zip

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename zip to project.zip
        run: |
          mv project-pd-v1429.zip project.zip
          git config user.name "bozdarstudio"
          git config user.email "bozdarstudio@users.noreply.github.com"
          git add -A
          git commit -m "Rename project-pd-v1429.zip to project.zip"
          git push
